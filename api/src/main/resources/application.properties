spring.application.name=relay-api
server.port=8081
server.servlet.context-path=/api

spring.datasource.url=jdbc:h2:file:./data/relay;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.username=sa
spring.datasource.password=
spring.flyway.enabled=true
spring.h2.console.enabled=false
spring.jackson.default-property-inclusion=non_null
spring.servlet.multipart.max-file-size=200MB
spring.servlet.multipart.max-request-size=210MB
spring.servlet.multipart.file-size-threshold=0

relay.worker.concurrency=16
relay.worker.poll-ms=500
relay.rate-limit.per-minute=100
relay.rate-limit.burst=100
